<body>
<div id="wrap">

  <input id="parser" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">

<script>
"use strict";
/* ============================================================
   Hugo IV: The Antique Shop of Horrors
   A retro EGA-style adventure (homage to Hugo's House of Horrors)
   - 320x200, 16-color EGA palette, nearest-neighbor scaling
   - Sierra-style: walk with arrows, type parser commands
   - PC-speaker-style sound via Web Audio square waves
   ============================================================ */

/* ---------- EGA 16-color palette ---------- */
const EGA = [
  [0,0,0],[0,0,170],[0,170,0],[0,170,170],
  [170,0,0],[170,0,170],[170,85,0],[170,170,170],
  [85,85,85],[85,85,255],[85,255,85],[85,255,255],
  [255,85,85],[255,85,255],[255,255,85],[255,255,255]
];
const RGB = EGA.map(c => `rgb(${c[0]},${c[1]},${c[2]})`);

/* ---------- Canvas setup ---------- */
const W = 320, H = 200;
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;
const parserInput = document.getElementById("parser");

function fitScreen() {
  const margin = 70;
  const scale = Math.max(1, Math.floor(Math.min(
    (window.innerWidth) / W,
    (window.innerHeight - margin) / H
  )));
  canvas.style.width = (W * scale) + "px";
  canvas.style.height = (H * scale) + "px";
}
window.addEventListener("resize", fitScreen);
fitScreen();

/* ---------- Pixel drawing helpers ---------- */
function clear(c) { ctx.fillStyle = RGB[c]; ctx.fillRect(0,0,W,H); }
function rect(x,y,w,h,c){ ctx.fillStyle = RGB[c]; ctx.fillRect(x|0,y|0,w|0,h|0); }
function px(x,y,c){ ctx.fillStyle = RGB[c]; ctx.fillRect(x|0,y|0,1,1); }
function line(x1,y1,x2,y2,c){
  ctx.strokeStyle = RGB[c];
  ctx.beginPath();
  ctx.moveTo((x1|0)+0.5,(y1|0)+0.5);
  ctx.lineTo((x2|0)+0.5,(y2|0)+0.5);
  ctx.stroke();
}
// dithered fill: classic EGA checkerboard of two colors
function dither(x,y,w,h,c1,c2){
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
    px(x+i,y+j, ((i+j)&1)?c1:c2);
  }
}

/* ---------- Bitmap font (5x7) ---------- */

const FONT = {

 'L':["10000","10000","10000","10000","10000","10000","11111"],

 'P':["11110","10001","10001","11110","10000","10000","10000"],
 'Q':["01110","10001","10001","10001","10101","10010","01101"],

 'W':["10001","10001","10001","10101","10101","11011","10001"],

 ':':["00000","01100","01100","00000","01100","01100","00000"],
 '-':["00000","00000","00000","11111","00000","00000","00000"],
 '+':["00000","00100","00100","11111","00100","00100","00000"],
 '/':["00001","00010","00100","00100","01000","10000","10000"],
 '(':["00010","00100","01000","01000","01000","00100","00010"],
 ')':["01000","00100","00010","00010","00010","00100","01000"],
 '&':["01100","10010","10100","01000","10101","10010","01101"],

};
function drawChar(ch,x,y,c){
  const g = FONT[ch] || FONT['?'];
  for(let j=0;j<7;j++){
    const row = g[j];
    for(let i=0;i<5;i++) if(row[i]==='1') px(x+i,y+j,c);
  }
}
function text(str,x,y,c){
  str = (str||"").toUpperCase();
  let cx = x;
  for(const ch of str){ drawChar(ch,cx,y,c); cx += 6; }
}
function textWidth(str){ return (str||"").length*6; }
function textCentered(str,y,c){ text(str, ((W - textWidth(str))/2)|0, y, c); }
// word-wrap into lines of max chars
function wrap(str, maxChars){
  const words = (str||"").split(" ");
  const lines = []; let cur = "";
  for(const w of words){
    if((cur+ (cur?" ":"") + w).length > maxChars){
      if(cur) lines.push(cur);
      cur = w;
    } else cur = cur ? cur+" "+w : w;
  }
  if(cur) lines.push(cur);
  return lines;
}

/* =========================================================
   SOUND: PC-speaker style square-wave beeper (Web Audio)
   ========================================================= */
const Sound = (() => {
  let actx = null;
  let muted = false;
  function ensure(){
    if(!actx){
      try { actx = new (window.AudioContext||window.webkitAudioContext)(); }
      catch(e){ actx = null; }
    }
    if(actx && actx.state === "suspended") actx.resume();
    return actx;
  }
  // play a single square tone
  function tone(freq, dur, when, vol){
    const a = ensure(); if(!a || muted) return;
    const t = (when==null? a.currentTime : when);
    const osc = a.createOscillator();
    const g = a.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime((vol==null?0.10:vol), t+0.005);
    g.gain.setValueAtTime((vol==null?0.10:vol), t+Math.max(0.01,dur-0.01));
    g.gain.linearRampToValueAtTime(0, t+dur);
    osc.connect(g); g.connect(a.destination);
    osc.start(t); osc.stop(t+dur+0.01);
  }
  // play a sequence: [[freq,durSeconds],...]  (freq 0 = rest)
  function play(seq, vol){
    const a = ensure(); if(!a) return;
    let t = a.currentTime + 0.01;
    for(const [f,d] of seq){
      if(f>0) tone(f, d*0.92, t, vol);
      t += d;
    }
  }
  return {
    beep(){ tone(880,0.05); },
    blip(){ tone(1320,0.03,null,0.07); },
    error(){ tone(160,0.18,null,0.12); },
    pickup(){ play([[784,0.06],[1047,0.06],[1319,0.10]]); },
    door(){ play([[300,0.07],[240,0.09]],0.12); },
    footstep(){ tone(110,0.025,null,0.05); },
    chime(){ play([[1047,0.08],[0,0.02],[1319,0.08],[0,0.02],[1568,0.16]]); },
    sting(){ play([[330,0.10],[311,0.10],[294,0.30]],0.13); }, // ominous
    title(){
      // a short spooky-jaunty theme in square wave
      const Q=0.18, E=0.09;
      play([
        [392,Q],[392,E],[440,E],[523,Q],[440,Q],
        [392,E],[349,E],[392,Q],[0,E],
        [330,Q],[349,E],[392,E],[440,Q],[392,Q],
        [330,Q],[294,Q],[262,Q+E]
      ], 0.09);
    },
    toggleMute(){ muted = !muted; return muted; }
  };
})();

function drawSprite(map,x,y,flip){
  const h = map.length, w = map[0].length;
  for(let j=0;j<h;j++){
    for(let i=0;i<w;i++){
      const ch = map[j][flip ? (w-1-i) : i];
      const c = SPR[ch];
      if(c>=0) px(x+i, y+j, c);
    }
  }
}

/* =========================================================
   GAME STATE
   ========================================================= */
const game = {

  room: "street",
  // player position (feet anchor roughly at px+5, py+19)
  px: 150, py: 150,
  facing: 1,             // 1 right, -1 left
  walking: false, walkPhase: 0,
  inv: [],
  flags: {},
  msg: "",
  msgTimer: 0,
  textColor: 15
};
function flag(k){ return !!game.flags[k]; }
function setFlag(k,v){ game.flags[k] = (v===undefined?true:v); }
function hasItem(id){ return game.inv.includes(id); }
function giveItem(id){ if(!hasItem(id)){ game.inv.push(id); } }
function takeItem(id){ game.inv = game.inv.filter(x=>x!==id); }

function say(s, color){
  game.msg = s;
  game.msgTimer = Math.max(180, s.length*4);
  game.textColor = color==null?15:color;
}

/* =========================================================
   PARSER
   ========================================================= */
function normalize(s){
  return s.toLowerCase().replace(/[^a-z0-9 ']/g," ").replace(/\s+/g," ").trim();
}
const STOP = new Set(["the","a","an","at","to","with","on","of","up","my","look","please"]);

function handleCommand(raw){
  const room = rooms[game.room];
  let s = normalize(raw);
  if(!s) return;
  let words = s.split(" ");
  let verb = words[0];

  // synonyms
  const vsyn = {
    l:"look", x:"look", examine:"look", inspect:"look", read:"look",
    take:"get", grab:"get", pick:"get", g:"get",
    i:"inventory", inv:"inventory", items:"inventory",
    walk:"go", move:"go", enter:"go",
    use:"use", give:"use",
    open:"open", unlock:"open",
    h:"help","?":"help", commands:"help",
    n:"north", s:"south", e:"east", w:"west"
  };
  if(vsyn[verb]) verb = vsyn[verb];

  let rest = words.slice(1).filter(w=>!STOP.has(w));
  let noun = rest[0] || "";
  // multiword nouns
  const joined = rest.join(" ");
  if(joined.includes("music")||joined.includes("box")) { if(joined!=="crate") noun = "music"; }
  if(joined.includes("clock")) noun = "clock";
  if(joined.includes("door")) noun = "door";
  if(joined.includes("mat")) noun = "mat";
  if(joined.includes("key")) noun = "key";

  Sound.blip();

  switch(verb){
    case "help":
      return say("VERBS: LOOK, GET, OPEN, USE, WIND, INVENTORY, GO. Move with ARROW KEYS. Walk into doorways/edges to travel.",11);

    case "inventory":
      if(game.inv.length===0) return say("You are carrying nothing but courage (and not much of that).",11);
      return say("You are carrying: " + game.inv.map(id=>ITEMS[id].name).join(", ") + ".",11);

    case "look": {
      if(room.look){
        const r = room.look(noun);
        if(r!==null && r!==undefined) return;
      }
      return say("You see nothing special about that.",7);
    }

    case "get": {
      // street: under the mat
      if(game.room==="street"){
        if(noun==="mat"||joined.includes("under")){
          if(flag("mat_moved")) return say("You already searched under the mat.",7);
          setFlag("mat_moved");
          giveItem("key");
          Sound.pickup();
          return say("You lift the WELCOME mat. A tarnished BRASS KEY glints beneath it. Taken!",10);
        }
        if(noun==="key"){
          if(hasItem("key")) return say("You already have the key.",7);
          return say("You don't see a key out here. Maybe something is hidden nearby...",14);
        }
      }
      if(game.room==="shop"){
        if(noun==="music"){
          if(flag("music_taken")) return say("You already took the music box.",7);
          setFlag("music_taken"); giveItem("music"); Sound.pickup();
          return say("You take the antique MUSIC BOX. It feels colder than it should.",10);
        }
        if(noun==="oil"||noun==="can") return say("You don't see an oil can here.",7);
      }
      if(!noun) return say("Get what, exactly?",7);
      return say("You can't take that.",7);
    }

    case "open": {
      if(game.room==="street" && (noun==="door"||!noun)){
        if(flag("door_open")) return say("The door is already open. Walk UP to enter.",10);
        if(hasItem("key")){
          setFlag("door_open"); Sound.door();
          return say("The brass key turns with a heavy CLUNK. The door swings open! Walk UP to enter.",10);
        }
        return say("It's locked. You need a key.",14);
      }
      if(game.room==="shop" && noun==="clock"){
        if(flag("clock_open")) return say("It's already open. A passage yawns behind it.",10);
        if(flag("clock_oiled")){
          setFlag("clock_open"); Sound.chime();
          return say("The case swings wide. Behind the clock is a hidden stair spiraling DOWN into darkness...",10);
        }
        return say("The case is RUSTED shut. You need to loosen it somehow (some OIL, perhaps?).",14);
      }
      if(noun==="music"||noun==="box") return say("Try WIND BOX instead.",7);
      return say("You can't open that.",7);
    }

    case "use": {
      if(noun==="key" && game.room==="street") return handleCommand("open door");
      if(noun==="music"||noun==="box") return handleCommand("wind box");
      if(noun==="oil" && game.room==="shop"){
        return say("You don't have any oil. (This is a vertical slice — the oil can comes later!)",14);
      }
      return say("Nothing happens.",7);
    }

    case "wind": {
      if((noun==="music"||noun==="box"||noun==="crank") ){
        if(!hasItem("music")) return say("You don't have the music box.",7);
        Sound.chime();
        setFlag("music_wound");
        return say("The music box tinkles a sad, familiar lullaby — Penelope used to hum it. The clock's PENDULUM shivers...",13);
      }
      if(noun==="clock") return say("You can't wind that creepy old clock by hand.",7);
      return say("Wind what?",7);
    }

    case "go":
    case "north": case "south": case "east": case "west": {
      let dir = (verb==="go")? noun : verb;
      if(game.room==="street"){
        if(dir==="up"||dir==="north"||dir==="in"||dir==="inside"||dir==="shop"||noun==="door"){
          if(flag("door_open")){ travel("shop"); return; }
          return say("The door is closed. Try: OPEN DOOR.",14);
        }
      }
      if(game.room==="shop"){
        if(dir==="west"||dir==="left"||dir==="out"||dir==="exit"||dir==="street"){ travel("street"); return; }
        if(dir==="down"||noun==="stair"||noun==="passage"){
          if(flag("clock_open")) return winSlice();
          return say("There's no way down... yet.",14);
        }
      }
      return say("You can't go that way.",7);
    }

    default:
      return say("I don't understand '"+raw.trim()+"'. Type HELP for verbs.",12), Sound.error();
  }
}

/* =========================================================
   TRAVEL between rooms
   ========================================================= */
function travel(id){
  const r = rooms[id];
  if(!r) return;
  game.room = id;
  game.px = r.enterX; game.py = r.enterY;
  game.walking = false;
  Sound.door();
  say("You enter: "+r.name+".",11);
}

function winSlice(){
  game.scene = "slice_end";
  Sound.sting();
}

/* =========================================================
   INPUT
   ========================================================= */
const keys = {};
window.addEventListener("keydown", (e)=>{
  // Title / end screens: Enter to advance
  if(game.scene!=="play"){
    if(e.key==="Enter"){
      if(game.scene==="title"){ game.scene="play"; travel("street"); Sound.beep(); }
      else if(game.scene==="slice_end"){ resetGame(); }
    }
    if(e.key==="m"||e.key==="M"){ Sound.toggleMute(); }
    return;
  }
  // mute toggle
  if((e.key==="m"||e.key==="M") && document.activeElement!==parserInput){
    Sound.toggleMute(); return;
  }
  // arrow movement
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)){
    keys[e.key] = true; e.preventDefault();
  }
});
window.addEventListener("keyup",(e)=>{ keys[e.key]=false; });

// Parser input: a hidden text field captures typed commands.
parserInput.addEventListener("keydown",(e)=>{ e.stopPropagation(); });
parserInput.addEventListener("keyup",(e)=>{
  e.stopPropagation();
  if(e.key==="Enter"){
    const v = parserInput.value;
    parserInput.value="";
    if(game.scene==="play" && v.trim()) handleCommand(v);
  }
});
// Focus the parser whenever the user types a letter
window.addEventListener("keydown",(e)=>{
  if(game.scene!=="play") return;
  if(e.key.length===1 && /[a-zA-Z0-9 '?]/.test(e.key) && document.activeElement!==parserInput){
    parserInput.focus();
  }
});
// click canvas to focus too
canvas.addEventListener("mousedown",()=>{ if(game.scene==="play") parserInput.focus(); ensureAudioOnGesture(); });
window.addEventListener("keydown", ensureAudioOnGesture, {once:false});
let _titlePlayed=false;
function ensureAudioOnGesture(){
  if(game.scene==="title" && !_titlePlayed){ _titlePlayed=true; Sound.title(); }
}

/* =========================================================
   UPDATE & RENDER LOOP
   ========================================================= */
const SPEED = 1.4;
let stepTimer = 0;
function update(){
  if(game.scene!=="play") return;
  const room = rooms[game.room];
  const wb = room.walk;
  let moving = false;
  let dx=0, dy=0;
  if(keys.ArrowLeft){ dx-=SPEED; game.facing=-1; }
  if(keys.ArrowRight){ dx+=SPEED; game.facing=1; }
  if(keys.ArrowUp){ dy-=SPEED; }
  if(keys.ArrowDown){ dy+=SPEED; }
  if(dx||dy){
    moving=true;
    game.px += dx; game.py += dy;
    // clamp feet to walkbox (py is top of sprite; sprite 19 tall)
    const footY = game.py + 19;
    if(game.px < wb.x) game.px = wb.x;
    if(game.px > wb.x+wb.w-11) game.px = wb.x+wb.w-11;
    if(footY < wb.y) game.py = wb.y-19;
    if(footY > wb.y+wb.h) game.py = wb.y+wb.h-19;

    // EDGE-TRIGGERED TRAVEL
    if(game.room==="street"){
      // walk up to the door region opens transition
      if(flag("door_open") && game.px>146 && game.px<188 && game.py+19 < 150){
        // need to be near the door horizontally and pushing up
        if(keys.ArrowUp){ travel("shop"); }
      }
    }
    if(game.room==="shop"){
      if(game.px <= wb.x+2){ travel("street"); }
      if(flag("clock_open") && game.px>150 && game.px<196 && keys.ArrowUp){ winSlice(); }
    }
  }
  game.walking = moving;
  if(moving){
    stepTimer++;
    if(stepTimer% 8===0){ game.walkPhase ^=1; Sound.footstep(); }
  } else { game.walkPhase=0; }

  if(game.msgTimer>0) game.msgTimer--;
}

function drawHUD(){
  // bottom message/parser bar
  rect(0,160,W,40, 0);
  rect(0,160,W,1, 8);
  // message (wrapped, 2-3 lines)
  const lines = wrap(game.msg || "", 51).slice(0,3);
  let yy=164;
  for(const ln of lines){ text(ln, 6, yy, (game.msgTimer>0?game.textColor:7)); yy+=8; }
  // prompt line
  text("> "+(parserInput.value.toUpperCase()), 6, 190, 10);
  // blinking cursor
  if(((performance.now()/400)|0)%2===0){
    rect(6 + textWidth("> "+parserInput.value), 190, 5, 7, 10);
  }
}

function renderPlay(){
  const room = rooms[game.room];
  room.draw();
  // draw Hugo
  const frame = (game.walking && game.walkPhase) ? HUGO_B : HUGO_A;
  drawSprite(frame, game.px|0, game.py|0, game.facing<0);
  drawHUD();
}

function renderTitle(){
  clear(0);
  // border
  rect(0,0,W,8,4); rect(0,H-8,W,8,4); rect(0,0,8,H,4); rect(W-8,0,8,H,4);
  dither(0,0,W,8,4,12); dither(0,H-8,W,8,12,4);
  // spooky house silhouette
  rect(110,70,100,60,8);
  rect(120,50,80,24,8);
  // roof
  for(let i=0;i<40;i++){ rect(130-i,72-i,2,2,0); rect(190+i,72-i,2,2,0); }
  rect(150,60,20,70,0);  // door col
  rect(124,80,12,12,14); rect(184,80,12,12,14); // lit windows
  rect(150,100,20,30,6); // door
  // a single floating antique: a clock
  rect(40,90,26,60,6); rect(43,93,20,20,15); rect(48,140,10,8,14);
  text("TICK", 36,76, 7);
  // title text
  textCentered("HUGO IV", 24, 14);
  textCentered("THE ANTIQUE SHOP", 36, 12);
  textCentered("OF HORRORS", 46, 12);
  // tagline
  textCentered("AN UNOFFICIAL EGA ADVENTURE", 158, 7);
  // prompt blink
  if(((performance.now()/500)|0)%2===0){
    textCentered("PRESS ENTER TO BEGIN", 176, 15);
  }
  textCentered("(M = TOGGLE SOUND)", 186, 8);
}

function renderSliceEnd(){
  clear(0);
  rect(0,0,W,8,5); rect(0,H-8,W,8,5);
  textCentered("THE HIDDEN STAIR", 30, 14);
  const body = "Behind the cursed grandfather clock, a stone stair spirals down into the dark. Penelope's lullaby still echoes from the music box in your pocket. Somewhere below, something is waiting...";
  const lines = wrap(body, 46);
  let y=58;
  for(const ln of lines){ textCentered(ln, y, 11); y+=10; }
  textCentered("END OF DEMO SLICE", y+14, 12);
  if(((performance.now()/500)|0)%2===0)
    textCentered("PRESS ENTER TO PLAY AGAIN", y+34, 15);
}

function resetGame(){
  game.scene="title";
  game.room="street";
  game.inv=[]; game.flags={};
  game.px=150; game.py=150; game.facing=1;
  game.msg=""; game.msgTimer=0;
  _titlePlayed=false;
}

function frame(){
  update();
  if(game.scene==="title") renderTitle();
  else if(game.scene==="slice_end") renderSliceEnd();
  else renderPlay();
  requestAnimationFrame(frame);
}

/* boot */
resetGame();
say("Welcome to YE OLDE ANTIQUES.",14);
frame();
</script>
