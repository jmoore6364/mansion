<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hugo IV: The Antique Shop of Horrors</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; color: #aaa;
    font-family: "Courier New", monospace;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
    box-sizing: border-box;
  }
  #stage {
    position: relative;
    display: inline-block;
    box-shadow: 0 0 0 2px #555, 0 0 40px #000;
    background: #000;
  }
  #screen {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
  }
  /* CRT scanline + vignette overlay */
  #crt {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at center,
        rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%),
      repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.0) 0px,
        rgba(0,0,0,0.0) 2px,
        rgba(0,0,0,0.28) 3px,
        rgba(0,0,0,0.28) 4px);
    mix-blend-mode: multiply;
    animation: flicker 5s infinite steps(60);
  }
  #crt.off { display:none; }
  @keyframes flicker {
    0%,100% { opacity: 1; }
    50% { opacity: 0.94; }
    52% { opacity: 1; }
  }
  #hint {
    font-size: 12px; color: #555;
    text-align: center; user-select: none; line-height: 1.5;
  }

  /* ----- shared retro control styling ----- */
  .rbtn {
    font-family: "Courier New", monospace;
    font-weight: bold;
    color: #cfcfcf;
    background: #1a1a1a;
    border: 2px solid #666;
    border-radius: 4px;
    box-shadow: 0 2px 0 #000;
    padding: 10px 14px;
    font-size: 15px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  .rbtn:active { background: #333; transform: translateY(1px); box-shadow: 0 1px 0 #000; }

  /* ----- title / death / win screen buttons ----- */
  #screenbtns {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
  }
  #screenbtns.hidden { display: none; }

  /* ----- in-game play controls (d-pad + command bar) ----- */
  #playctrls {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    width: 100%;
  }
  #playctrls.hidden { display: none; }

  #cmdbar {
    display: flex; align-items: center; gap: 6px;
    width: min(92vw, 520px);
    background: #000; border: 2px solid #555; border-radius: 4px;
    padding: 4px 6px; box-sizing: border-box;
  }
  #cmdbar .prompt { color: #5f5; font-weight: bold; font-size: 16px; }
  #parser {
    flex: 1 1 auto; min-width: 0;
    background: #000; color: #5f5; border: none; outline: none;
    font-family: "Courier New", monospace; font-size: 16px; /* >=16px avoids iOS zoom */
    text-transform: uppercase;
    padding: 8px 4px;
  }
  #send { flex: 0 0 auto; }

  /* D-pad: only meaningful for touch; hidden on pointer:fine devices */
  #dpad {
    display: none;
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(3, 58px);
    gap: 6px;
    touch-action: none;
  }
  #dpad .dbtn {
    font-size: 22px; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #dpad .up    { grid-column: 2; grid-row: 1; }
  #dpad .left  { grid-column: 1; grid-row: 2; }
  #dpad .right { grid-column: 3; grid-row: 2; }
  #dpad .down  { grid-column: 2; grid-row: 3; }

  /* Show the d-pad and toggle buttons only on touch (coarse pointer) devices */
  body.touch #dpad { display: grid; }
  #toggles { display: none; gap: 10px; }
  body.touch #toggles { display: flex; }
  body.touch #hint { display: none; }     /* keyboard hint is irrelevant on touch */

  /* Landscape phones: put the controls in a column beside the screen so the
     canvas can use the full height instead of fighting for vertical space. */
  @media (orientation: landscape) {
    body.touch #wrap { flex-direction: row; gap: 14px; align-items: center; }
    body.touch #playctrls { width: auto; }
    body.touch #screenbtns { flex-direction: column; }
    body.touch #cmdbar { width: 220px; }
    body.touch #dpad {
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(3, 50px);
    }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="screen" width="320" height="200"></canvas>
    <div id="crt"></div>
  </div>
  <div id="hint">Arrow keys = walk &nbsp;•&nbsp; Click an object to interact, or click the floor to walk &nbsp;•&nbsp; Type a command + Enter<br>
  LOOK / GET / OPEN / USE / WIND / SAVE / LOAD &nbsp;•&nbsp; I = inventory &nbsp;•&nbsp; M = sound &nbsp;•&nbsp; T = CRT filter</div>

  <!-- Title / death / win screen buttons (tap to advance) -->
  <div id="screenbtns" class="hidden">
    <button id="btnPrimary" class="rbtn">START</button>
    <button id="btnContinue" class="rbtn">CONTINUE</button>
  </div>

  <!-- In-game controls: command bar + on-screen d-pad (touch) -->
  <div id="playctrls" class="hidden">
    <div id="cmdbar">
      <span class="prompt">&gt;</span>
      <input id="parser" type="text" autocomplete="off" autocapitalize="characters"
             autocorrect="off" spellcheck="false" enterkeyhint="go"
             placeholder="type a command...">
      <button id="send" class="rbtn">GO</button>
    </div>
    <div id="dpad">
      <button class="rbtn dbtn up"    data-dir="ArrowUp"    aria-label="up">&#9650;</button>
      <button class="rbtn dbtn left"  data-dir="ArrowLeft"  aria-label="left">&#9664;</button>
      <button class="rbtn dbtn right" data-dir="ArrowRight" aria-label="right">&#9654;</button>
      <button class="rbtn dbtn down"  data-dir="ArrowDown"  aria-label="down">&#9660;</button>
    </div>
    <div id="toggles">
      <button id="btnInv" class="rbtn">ITEMS</button>
      <button id="btnSound" class="rbtn">SOUND</button>
      <button id="btnCRT" class="rbtn">CRT</button>
    </div>
  </div>
</div>
<script>
"use strict";
/* ============================================================
   Hugo IV: The Antique Shop of Horrors
   A retro EGA-style adventure (homage to Hugo's House of Horrors)
   - 320x200, 16-color EGA palette, nearest-neighbor scaling
   - Sierra-style: walk with arrows, type parser commands
   - PC-speaker-style sound via Web Audio square waves
   - Death/respawn, save/restore (localStorage), CRT shader
   ============================================================ */

/* ---------- EGA 16-color palette ---------- */
const EGA = [
  [0,0,0],[0,0,170],[0,170,0],[0,170,170],
  [170,0,0],[170,0,170],[170,85,0],[170,170,170],
  [85,85,85],[85,85,255],[85,255,85],[85,255,255],
  [255,85,85],[255,85,255],[255,255,85],[255,255,255]
];
const RGB = EGA.map(c => `rgb(${c[0]},${c[1]},${c[2]})`);

/* ---------- Canvas setup ---------- */
const W = 320, H = 200;
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;
const parserInput = document.getElementById("parser");
const crtEl = document.getElementById("crt");

function fitScreen() {
  // Reserve room for the on-screen controls. In portrait they stack below the
  // canvas (vertical reserve); in landscape they sit beside it (horizontal).
  const isTouch = document.body.classList.contains("touch");
  const landscape = window.innerWidth > window.innerHeight;
  let availW = window.innerWidth, availH = window.innerHeight;
  if(isTouch && landscape){ availW -= 250; availH -= 16; }
  else if(isTouch){ availH -= 300; }
  else { availH -= 100; }
  const scale = Math.max(1, Math.floor(Math.min(availW / W, availH / H)));
  canvas.style.width = (W * scale) + "px";
  canvas.style.height = (H * scale) + "px";
}
window.addEventListener("resize", fitScreen);
window.addEventListener("orientationchange", ()=> setTimeout(fitScreen, 100));
fitScreen();

/* ---------- Pixel drawing helpers ---------- */
function clear(c) { ctx.fillStyle = RGB[c]; ctx.fillRect(0,0,W,H); }
function rect(x,y,w,h,c){ ctx.fillStyle = RGB[c]; ctx.fillRect(x|0,y|0,w|0,h|0); }
function px(x,y,c){ ctx.fillStyle = RGB[c]; ctx.fillRect(x|0,y|0,1,1); }
function line(x1,y1,x2,y2,c){
  ctx.strokeStyle = RGB[c];
  ctx.beginPath();
  ctx.moveTo((x1|0)+0.5,(y1|0)+0.5);
  ctx.lineTo((x2|0)+0.5,(y2|0)+0.5);
  ctx.stroke();
}
function dither(x,y,w,h,c1,c2){
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
    px(x+i,y+j, ((i+j)&1)?c1:c2);
  }
}

/* ---------- Bitmap font (5x7) ---------- */
const FONT = {
 'A':["01110","10001","10001","11111","10001","10001","10001"],
 'B':["11110","10001","11110","10001","10001","10001","11110"],
 'C':["01110","10001","10000","10000","10000","10001","01110"],
 'D':["11100","10010","10001","10001","10001","10010","11100"],
 'E':["11111","10000","11110","10000","10000","10000","11111"],
 'F':["11111","10000","11110","10000","10000","10000","10000"],
 'G':["01110","10001","10000","10111","10001","10001","01111"],
 'H':["10001","10001","11111","10001","10001","10001","10001"],
 'I':["11111","00100","00100","00100","00100","00100","11111"],
 'J':["00111","00010","00010","00010","10010","10010","01100"],
 'K':["10001","10010","11100","10100","10010","10001","10001"],
 'L':["10000","10000","10000","10000","10000","10000","11111"],
 'M':["10001","11011","10101","10101","10001","10001","10001"],
 'N':["10001","11001","10101","10011","10001","10001","10001"],
 'O':["01110","10001","10001","10001","10001","10001","01110"],
 'P':["11110","10001","10001","11110","10000","10000","10000"],
 'Q':["01110","10001","10001","10001","10101","10010","01101"],
 'R':["11110","10001","10001","11110","10100","10010","10001"],
 'S':["01111","10000","10000","01110","00001","00001","11110"],
 'T':["11111","00100","00100","00100","00100","00100","00100"],
 'U':["10001","10001","10001","10001","10001","10001","01110"],
 'V':["10001","10001","10001","10001","10001","01010","00100"],
 'W':["10001","10001","10001","10101","10101","11011","10001"],
 'X':["10001","10001","01010","00100","01010","10001","10001"],
 'Y':["10001","10001","01010","00100","00100","00100","00100"],
 'Z':["11111","00001","00010","00100","01000","10000","11111"],
 '0':["01110","10011","10101","10101","11001","10001","01110"],
 '1':["00100","01100","00100","00100","00100","00100","01110"],
 '2':["01110","10001","00001","00110","01000","10000","11111"],
 '3':["11110","00001","00001","01110","00001","00001","11110"],
 '4':["00010","00110","01010","10010","11111","00010","00010"],
 '5':["11111","10000","11110","00001","00001","10001","01110"],
 '6':["01110","10000","11110","10001","10001","10001","01110"],
 '7':["11111","00001","00010","00100","01000","01000","01000"],
 '8':["01110","10001","01110","10001","10001","10001","01110"],
 '9':["01110","10001","10001","01111","00001","00001","01110"],
 '.':["00000","00000","00000","00000","00000","01100","01100"],
 ',':["00000","00000","00000","00000","01100","01100","00100"],
 '!':["00100","00100","00100","00100","00100","00000","00100"],
 '?':["01110","10001","00010","00100","00100","00000","00100"],
 "'":["00100","00100","00100","00000","00000","00000","00000"],
 ':':["00000","01100","01100","00000","01100","01100","00000"],
 '-':["00000","00000","00000","11111","00000","00000","00000"],
 '+':["00000","00100","00100","11111","00100","00100","00000"],
 '/':["00001","00010","00100","00100","01000","10000","10000"],
 '(':["00010","00100","01000","01000","01000","00100","00010"],
 ')':["01000","00100","00010","00010","00010","00100","01000"],
 '&':["01100","10010","10100","01000","10101","10010","01101"],
 '%':["11001","11010","00100","01000","10011","00101","00100"],
 ' ':["00000","00000","00000","00000","00000","00000","00000"]
};
function drawChar(ch,x,y,c){
  const g = FONT[ch] || FONT['?'];
  for(let j=0;j<7;j++){
    const row = g[j];
    for(let i=0;i<5;i++) if(row[i]==='1') px(x+i,y+j,c);
  }
}
function text(str,x,y,c){
  str = (str||"").toUpperCase();
  let cx = x;
  for(const ch of str){ drawChar(ch,cx,y,c); cx += 6; }
}
function textWidth(str){ return (str||"").length*6; }
function textCentered(str,y,c){ text(str, ((W - textWidth(str))/2)|0, y, c); }
function wrap(str, maxChars){
  const words = (str||"").split(" ");
  const lines = []; let cur = "";
  for(const w of words){
    if((cur+ (cur?" ":"") + w).length > maxChars){
      if(cur) lines.push(cur);
      cur = w;
    } else cur = cur ? cur+" "+w : w;
  }
  if(cur) lines.push(cur);
  return lines;
}

/* =========================================================
   SOUND: PC-speaker style square-wave beeper (Web Audio)
   ========================================================= */
const Sound = (() => {
  let actx = null, muted = false;
  function ensure(){
    if(!actx){
      try { actx = new (window.AudioContext||window.webkitAudioContext)(); }
      catch(e){ actx = null; }
    }
    if(actx && actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, dur, when, vol){
    const a = ensure(); if(!a || muted) return;
    const t = (when==null? a.currentTime : when);
    const osc = a.createOscillator();
    const g = a.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime((vol==null?0.10:vol), t+0.005);
    g.gain.setValueAtTime((vol==null?0.10:vol), t+Math.max(0.01,dur-0.01));
    g.gain.linearRampToValueAtTime(0, t+dur);
    osc.connect(g); g.connect(a.destination);
    osc.start(t); osc.stop(t+dur+0.01);
  }
  function play(seq, vol){
    const a = ensure(); if(!a) return;
    let t = a.currentTime + 0.01;
    for(const [f,d] of seq){ if(f>0) tone(f, d*0.92, t, vol); t += d; }
  }
  return {
    beep(){ tone(880,0.05); },
    blip(){ tone(1320,0.03,null,0.07); },
    error(){ tone(160,0.18,null,0.12); },
    pickup(){ play([[784,0.06],[1047,0.06],[1319,0.10]]); },
    door(){ play([[300,0.07],[240,0.09]],0.12); },
    footstep(){ tone(110,0.025,null,0.05); },
    chime(){ play([[1047,0.08],[0,0.02],[1319,0.08],[0,0.02],[1568,0.16]]); },
    sting(){ play([[330,0.10],[311,0.10],[294,0.30]],0.13); },
    death(){ play([[392,0.14],[370,0.14],[349,0.14],[330,0.45]],0.14); },
    fanfare(){ play([[523,0.12],[659,0.12],[784,0.12],[1047,0.30],[0,0.05],[784,0.12],[1047,0.40]],0.11); },
    lullaby(){
      const Q=0.22,E=0.11;
      play([[659,Q],[587,E],[523,E],[587,Q],[659,Q],[659,Q],[659,Q+E],
            [587,Q],[587,Q],[587,Q+E],[659,Q],[784,Q],[784,Q+E]],0.085);
    },
    title(){
      const Q=0.18, E=0.09;
      play([[392,Q],[392,E],[440,E],[523,Q],[440,Q],[392,E],[349,E],[392,Q],[0,E],
            [330,Q],[349,E],[392,E],[440,Q],[392,Q],[330,Q],[294,Q],[262,Q+E]], 0.09);
    },
    toggleMute(){ muted = !muted; return muted; },
    isMuted(){ return muted; }
  };
})();

/* =========================================================
   SPRITES (pixel maps); '.' = transparent
   ========================================================= */
const SPR = {
  '.':-1,'H':6,'h':8,'F':14,'S':12,'s':4,'P':1,'p':9,'B':0,'W':15,'k':0,
  'D':13,'d':5,'Y':14,'G':10
};
const HUGO_A = [
  "...HHHHH...","..HHHHHHH..","..HhFFFhh..","..hFFFFFh..","..hFBFBFh..",
  "..hFFFFFh..","...hFFFh...","..WWSSSWW..",".WSSSSSSSW.","WSSSSSSSSSW",
  "WSsSSSSSsSW",".SSSSSSSSS.","..SSSSSSS..","..PPP.PPP..","..PPP.PPP..",
  "..PPP.PPP..","..PP...PP..","..kk...kk..",".kkk...kkk."
];
const HUGO_B = [
  "...HHHHH...","..HHHHHHH..","..HhFFFhh..","..hFFFFFh..","..hFBFBFh..",
  "..hFFFFFh..","...hFFFh...","..WWSSSWW..",".WSSSSSSSW.","WSSSSSSSSSW",
  "WSsSSSSSsSW",".SSSSSSSSS.","..SSSSSSS..","..PPP.PPP..","..PPP.PPP..",
  "...PP.PP...","...PP.PP...","..kk...kk..","..kkk.kkk.."
];
// Penelope: yellow hair, magenta dress
const PEN = [
  "...YYYYY...","..YYYYYYY..","..YhFFFhY..","..hFFFFFh..","..hFBFBFh..",
  "..hFFFFFh..","...hFFFh...","...DDDDD...","..DDDDDDD..",".DDDDDDDDD.",
  "DDDDDDDDDDD","DDDDdDDDDDD",".DDDDDDDDD.",".DDDDDDDDD.","..DDDDDDD..",
  "..DDDDDDD..","...DDDDD...","...k...k...","..kk...kk.."
];
function drawSprite(map,x,y,flip){
  const h = map.length, w = map[0].length;
  for(let j=0;j<h;j++) for(let i=0;i<w;i++){
    const ch = map[j][flip ? (w-1-i) : i];
    const c = SPR[ch];
    if(c>=0) px(x+i, y+j, c);
  }
}

/* =========================================================
   GAME STATE
   ========================================================= */
const game = {
  scene: "title",   // title | play | dead | win | slice (unused)
  room: "street",
  px: 150, py: 150,
  facing: 1,
  walking: false, walkPhase: 0,
  inv: [], flags: {},
  msg: "", msgTimer: 0, textColor: 15,
  deathCause: "",
  score: 0, deaths: 0, awarded: {},
  target: null,   // point-and-click walk target {x,y}
  invOpen: false, // inventory panel visible
  tapFx: null     // transient tap highlight {x,y,w,h,life}
};
function flag(k){ return !!game.flags[k]; }
function setFlag(k,v){ game.flags[k] = (v===undefined?true:v); }
function hasItem(id){ return game.inv.includes(id); }
function giveItem(id){ if(!hasItem(id)) game.inv.push(id); }
function takeItem(id){ game.inv = game.inv.filter(x=>x!==id); }
function say(s, color){
  game.msg = s;
  game.msgTimer = Math.max(220, s.length*4);
  game.textColor = color==null?15:color;
}

/* =========================================================
   HAPTICS (mobile rumble; no-op on desktop / unsupported)
   ========================================================= */
const Haptic = {
  buzz(pattern){
    try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
  }
};

/* =========================================================
   SCORE — Sierra-style points for solving the adventure
   ========================================================= */
const SCORES = {
  key:10, shop:5, oil:10, music:10, lantern:10, oil_clock:10,
  open_clock:10, descend:5, coin:15, gate:15, freed:20,
  lab:5, gloves:10, defeat:25
};
const MAX_SCORE = Object.values(SCORES).reduce((a,b)=>a+b,0);
function award(name){
  if(game.awarded[name] || !(name in SCORES)) return;
  game.awarded[name] = true;
  game.score += SCORES[name];
  Sound.blip();
  Haptic.buzz(12);
}

/* =========================================================
   SAVE / RESTORE (localStorage)
   ========================================================= */
const SAVE_KEY = "hugo4_save_v1";
function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      room:game.room, px:game.px, py:game.py, facing:game.facing,
      inv:game.inv, flags:game.flags,
      score:game.score, deaths:game.deaths, awarded:game.awarded
    }));
    return true;
  }catch(e){ return false; }
}
function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }
function loadGame(){
  try{
    const s = localStorage.getItem(SAVE_KEY); if(!s) return false;
    const d = JSON.parse(s);
    game.room=d.room; game.px=d.px; game.py=d.py; game.facing=d.facing||1;
    game.inv=d.inv||[]; game.flags=d.flags||{};
    game.score=d.score||0; game.deaths=d.deaths||0; game.awarded=d.awarded||{};
    game.scene="play"; game.walking=false;
    return true;
  }catch(e){ return false; }
}

/* =========================================================
   DEATH & RESPAWN
   ========================================================= */
function die(cause){
  game.deathCause = cause;
  game.deaths++;
  game.scene = "dead";
  Sound.death();
  Haptic.buzz([90,50,140]);
}
function respawn(){
  // Forgiving: keep inventory & flags, return to a safe spot in the room.
  const r = rooms[game.room];
  game.px = r.enterX; game.py = r.enterY;
  game.scene = "play"; game.walking = false;
  say("You pull yourself together. That was close.",11);
}

/* =========================================================
   ITEMS
   ========================================================= */
const ITEMS = {
  key:     { name:"a brass key" },
  oil:     { name:"an oil can" },
  coin:    { name:"a silver coin" },
  music:   { name:"an antique music box" },
  lantern: { name:"a lit brass lantern" },
  gloves:  { name:"a pair of rubber gloves" }
};
const ITEM_DESC = {
  key:    "A heavy brass key, worn smooth. It let you into the shop.",
  oil:    "A dented oil can, still half full. Good for stuck, rusted mechanisms.",

        return say(flag("gloves_taken")?"A cluttered workbench, now missing its gloves.":"A workbench strewn with tools - and a pair of rubber GLOVES.",14);
      }
      if(noun==="gloves"||noun==="glove"){
        if(hasItem("gloves")) return say("Your rubber gloves. Insulation against a nasty shock.",14);
        if(flag("gloves_taken")) return say("You already took the gloves.",7);
        return say("A pair of thick rubber GLOVES on the bench. Try: GET GLOVES.",14);
      }
      if(noun==="machine"||noun==="coil"||noun==="console") return say(flag("defeated")?"A dead tangle of wire and glass.":"A towering machine of coils and dials, pouring current into the doctor.",12);
      return null;
    }
  }
};

/* =========================================================
   PARSER
   ========================================================= */
function normalize(s){
  return s.toLowerCase().replace(/[^a-z0-9 ']/g," ").replace(/\s+/g," ").trim();
}
const STOP = new Set(["the","a","an","at","to","with","on","of","up","my","look","please","in","into"]);

function handleCommand(raw){
  const room = rooms[game.room];
  let s = normalize(raw);
  if(!s) return;
  let words = s.split(" ");
  let verb = words[0];

  const vsyn = {
    l:"look", x:"look", examine:"look", inspect:"look", read:"look",
    take:"get", grab:"get", pick:"get", g:"get",
    i:"inventory", inv:"inventory", items:"inventory",
    walk:"go", move:"go", enter:"go",
    use:"use", insert:"use", put:"use", give:"use", pay:"use", oil:"use",
    pull:"use", flip:"use", yank:"use", throw:"use", wear:"use",
    open:"open", unlock:"open",
    h:"help","?":"help", commands:"help",
    restore:"load", continue:"load",
    n:"north", s:"south", e:"east", w:"west"
  };
  const rawVerb = verb;
  if(vsyn[verb]) verb = vsyn[verb];

  let rest = words.slice(1).filter(w=>!STOP.has(w));
  let noun = rest[0] || "";
  const joined = rest.join(" ");
  if(joined.includes("music")||joined.includes("box")){ if(!joined.includes("crate")) noun = "music"; }
  if(joined.includes("clock")) noun = "clock";
  if(joined.includes("door")) noun = "door";
  if(joined.includes("mat")) noun = "mat";
  if(joined.includes("key")) noun = "key";
  if(joined.includes("oil")||joined.includes("can")) noun = "oil";
  if(joined.includes("coin")||joined.includes("silver")) noun = "coin";
  if(joined.includes("clock")) noun = "clock";
  if(joined.includes("sarc")||joined.includes("coffin")||joined.includes("tomb")) noun = "sarcophagus";
  if(joined.includes("gate")||joined.includes("slot")||joined.includes("bars")) noun = "gate";
  if(joined.includes("crate")) noun = "crate";
  if(joined.includes("lantern")) noun = "lantern";
  if(joined.includes("lever")||joined.includes("switch")) noun = "lever";
  if(joined.includes("glove")) noun = "gloves";
  if(joined.includes("hammerstein")||joined.includes("doctor")) noun = "hammerstein";
  // special: verbs that imply their object
  if(rawVerb==="oil"){ verb="use"; noun="oil"; }
  if((rawVerb==="pull"||rawVerb==="flip"||rawVerb==="yank"||rawVerb==="throw") && !noun) noun="lever";
  if(rawVerb==="wear" && !noun) noun="gloves";

  Sound.blip();

  switch(verb){
    case "help":
      return say("TAP or CLICK objects to interact, tap the floor to walk. Or type: LOOK, GET, OPEN, USE, WIND, INVENTORY, GO, SAVE, LOAD. Open ITEMS for your inventory.",11);

    case "save": {
      const ok = saveGame();
      return say(ok?"Game saved. (Your progress is stored in this browser.)":"Could not save here.", ok?10:12);
    }

    case "load":
      if(loadGame()){ Sound.door(); return say("Game restored. You are in: "+rooms[game.room].name+".",10); }
      return say("No saved game found.",12);

    case "inventory":
      if(game.inv.length===0) return say("You are carrying nothing but courage (and not much of that).",11);
      return say("You are carrying: " + game.inv.map(id=>ITEMS[id].name).join(", ") + ".",11);

    case "look": {
      if(room.look){ const r = room.look(noun); if(r!==null && r!==undefined) return; }
      return say("You see nothing special about that.",7);
    }

    case "get": {
      if(game.room==="street" && (noun==="mat"||joined.includes("under"))){
        if(flag("mat_moved")) return say("You already searched under the mat.",7);
        setFlag("mat_moved"); giveItem("key"); Sound.pickup(); Haptic.buzz(20); award("key");
        return say("You lift the WELCOME mat. A tarnished BRASS KEY glints beneath it. Taken!",10);
      }
      if(game.room==="shop"){
        if(noun==="music"){
          if(flag("music_taken")) return say("You already took the music box.",7);
          setFlag("music_taken"); giveItem("music"); Sound.pickup(); Haptic.buzz(20); award("music");
          return say("You take the antique MUSIC BOX. It feels colder than it should.",10);
        }
        if(noun==="oil"){
          if(flag("oil_taken")) return say("You already have the oil can.",7);
          setFlag("oil_taken"); giveItem("oil"); Sound.pickup(); Haptic.buzz(20); award("oil");
          return say("You pick up the dented OIL CAN. Still half full. Useful!",10);
        }
      }
      if(game.room==="upstairs" && noun==="lantern"){
        if(flag("lantern_taken")) return say("You already have the lantern.",7);
        setFlag("lantern_taken"); giveItem("lantern"); Sound.pickup(); Haptic.buzz(20); award("lantern");
        return say("You take the lit brass LANTERN. Its warm glow pushes back the shadows.",10);
      }
      if(game.room==="lab" && noun==="gloves"){
        if(flag("gloves_taken")) return say("You already have the gloves.",7);
        setFlag("gloves_taken"); giveItem("gloves"); Sound.pickup(); Haptic.buzz(20); award("gloves");
        return say("You grab the thick rubber GLOVES off the bench. They might save your life.",10);
      }
      if(game.room==="catacombs" && noun==="coin"){
        if(!hasItem("lantern")) return say("It's too dark to find anything. You need a LIGHT.",7);
        if(hasItem("coin")) return say("You already have the coin.",7);
        if(!flag("sarc_looked")) return say("You don't see a coin. Try LOOKing around first.",7);
        setFlag("coin_taken"); giveItem("coin"); Sound.pickup(); Haptic.buzz(20); award("coin");
        return say("You snatch the SILVER COIN off the sarcophagus lid. The skull's grin seems to widen...",10);
      }
      if(noun==="key" && !hasItem("key")) return say("You don't see a key here.",7);
      if(!noun) return say("Get what, exactly?",7);
      return say("You can't take that.",7);
    }

    case "open": {
      if(game.room==="street" && (noun==="door"||!noun)){
        if(flag("door_open")) return say("The door is already open. Walk UP to enter.",10);
        if(hasItem("key")){ setFlag("door_open"); Sound.door();
          return say("The brass key turns with a heavy CLUNK. The door swings open! Walk UP to enter.",10); }
        return say("It's locked. You need a key.",14);
      }
      if(game.room==="shop"){
        if(noun==="clock"){
          if(flag("clock_open")) return say("It's already open. A stair leads down.",10);
          if(flag("clock_oiled")){ setFlag("clock_open"); Sound.chime(); award("open_clock");
            return say("The case swings wide. Behind the clock, a stone stair spirals DOWN into the dark. Walk UP to descend.",10); }
          return say("The case is RUSTED shut. You need to loosen it (some OIL, perhaps?).",14);
        }
        if(noun==="crate"){
          return die("You pry open the crate. A pair of glowing eyes! Something with too many teeth lunges out and that, sadly, is the end of Hugo.");
        }
      }
      if(game.room==="catacombs"){
        if(!hasItem("lantern")) return say("It's too dark to see what you're doing down here.",7);
        if(noun==="sarcophagus"){
          return die("You heave the stone lid aside. A withered MUMMY sits up, eyes blazing, and drags you into the dark. Curiosity, it turns out, also kills the Hugo.");
        }
        if(noun==="gate"){
          if(flag("gate_open")) return say("The gate is already open.",10);
          return say("The gate won't budge. Maybe that COIN SLOT is the key. Try: USE COIN.",14);
        }
      }
      if(noun==="music"||noun==="box") return say("Try WIND BOX instead.",7);
      return say("You can't open that.",7);
    }

    case "use": {
      if(noun==="key" && game.room==="street") return handleCommand("open door");
      if((noun==="music"||noun==="box")) return handleCommand("wind box");
      if(noun==="oil"){
        if(!hasItem("oil")) return say("You don't have any oil.",7);
        if(game.room==="shop"){
          if(flag("clock_oiled")) return say("The clock is already well oiled.",7);
          setFlag("clock_oiled"); Sound.chime(); award("oil_clock");
          return say("You squirt oil into the clock's rusted hinges. They loosen with a groan. Now try: OPEN CLOCK.",10);
        }
        return say("Nothing here needs oiling.",7);
      }
      if(noun==="coin"){
        if(!hasItem("coin")) return say("You don't have a coin.",7);
        if(game.room==="catacombs"){
          if(!hasItem("lantern")) return say("It's too dark to find the slot. You need a LIGHT.",7);
          if(flag("gate_open")) return say("The gate is already open.",7);
          takeItem("coin"); setFlag("gate_open"); Sound.chime(); award("gate");
          return say("You slide the silver coin into the slot. Gears grind, and the iron GATE shudders open. Walk EAST.",10);
        }
        return say("There's nowhere to use the coin here.",7);
      }
      if(noun==="gloves"){
        if(!hasItem("gloves")) return say("You don't have any gloves.",7);
        return say("You snug the rubber gloves on. Now your hands are insulated - time to deal with that LEVER.",11);
      }
      if(noun==="lever"||noun==="switch"){
        if(game.room!=="lab") return say("There's no lever here.",7);
        if(flag("defeated")) return say("The lever is already thrown. The machine is dead.",10);
        if(!hasItem("gloves")){
          return die("You seize the sparking lever bare-handed. A blinding arc of current roars through you - and Hugo is, quite literally, fried. (You'll want something INSULATING first.)");
        }
        setFlag("defeated"); award("defeat"); Sound.sting();
        setTimeout(()=>{ game.scene="win"; }, 2800);
        return say("Gloved hands gripping the lever, you HEAVE. The machine screams, throws sparks, and dies - and Dr. Hammerstein crumples with it. You did it!",14);
      }
      return say("Nothing happens.",7);
    }

    case "wind": {
      if(noun==="music"||noun==="box"||noun==="crank"){
        if(!hasItem("music")) return say("You don't have the music box.",7);
        if(game.room==="crypt" && !flag("freed")){
          setFlag("freed"); setFlag("lab_open"); Sound.lullaby(); award("freed");
          game.follow = {x:game.px - game.facing*13, y:game.py};
          return say("You wind the music box. Penelope's lullaby fills the crypt - the glass shatters and she wakes! But the tune stirs something deeper: a stone door grinds open to the EAST...",14);
        }
        if(flag("freed")) return say("The music box plays softly. Penelope hums along, keeping close.",13);
        Sound.lullaby(); setFlag("music_wound");
        return say("The music box tinkles a sad, familiar lullaby - Penelope used to hum it. Somewhere, the tune feels... important.",13);
      }
      if(noun==="clock") return say("You can't wind that cursed old clock by hand.",7);
      return say("Wind what?",7);
    }

    case "go":
    case "north": case "south": case "east": case "west": {
      let dir = (verb==="go")? noun : verb;
      if(game.room==="street"){
        if(["up","north","in","inside","shop","door"].includes(dir)){
          if(flag("door_open")){ travel("shop"); return; }
          return say("The door is closed. Try: OPEN DOOR.",14);
        }
      }
      if(game.room==="shop"){
        if(["west","left","out","exit","street"].includes(dir)){ travel("street"); return; }
        if(["right","up","upstairs","stairs","stair","parlor"].includes(dir)){ travel("upstairs"); return; }
        if(["down","descend","north"].includes(dir) || noun==="clock"){
          if(flag("clock_open")){ travel("catacombs"); return; }
          return say("There's no way down... yet.",14);
        }
      }
      if(game.room==="upstairs"){
        if(["right","down","downstairs","out","stairs","stair","shop"].includes(dir)){ travel("shop"); return; }
      }
      if(game.room==="catacombs"){
        if(["up","west","left","stair","stairs","shop"].includes(dir)){ travel("shop"); return; }
        if(["east","right","gate","crypt"].includes(dir)){
          if(flag("gate_open")){ travel("crypt"); return; }
          return say("The gate bars the way east.",14);
        }
      }
      if(game.room==="crypt"){
        if(["west","left","out","gate","catacombs"].includes(dir)){ travel("catacombs"); return; }
        if(["east","right","door","lab","laboratory"].includes(dir)){
          if(flag("lab_open")){ travel("lab"); return; }
          return say("There's only solid stone to the east.",7);
        }
      }
      if(game.room==="lab"){
        if(["west","left","out","back","crypt"].includes(dir)){ travel("crypt"); return; }
      }
      return say("You can't go that way.",7);
    }

    default:
      Sound.error();
      return say("I don't understand '"+raw.trim()+"'. Type HELP for verbs.",12);
  }
}

/* =========================================================
   TRAVEL
   ========================================================= */
function travel(id){
  const r = rooms[id]; if(!r) return;
  game.room = id; game.px = r.enterX; game.py = r.enterY; game.walking=false;
  game.target = null; game.invOpen = false;
  Sound.door(); Haptic.buzz(12);
  if(id==="shop") award("shop");
  if(id==="catacombs") award("descend");
  if(id==="lab") award("lab");
  say("You enter: "+r.name+".",11);
  saveGame(); // autosave on room change
}

/* =========================================================
   INPUT
   ========================================================= */
const keys = {};
let crtOn = true;
function setCRT(on){ crtOn = on; crtEl.classList.toggle("off", !on); updateToggleLabels(); }

// ---- touch detection ----
const TOUCH = matchMedia("(pointer: coarse)").matches
           || ("ontouchstart" in window)
           || navigator.maxTouchPoints > 0;
if(TOUCH){ document.body.classList.add("touch"); fitScreen(); }

// ---- element handles ----
const elScreenBtns = document.getElementById("screenbtns");
const elPlayCtrls  = document.getElementById("playctrls");
const elPrimary    = document.getElementById("btnPrimary");
const elContinue   = document.getElementById("btnContinue");
const elSend       = document.getElementById("send");
const elSound      = document.getElementById("btnSound");
const elCRT        = document.getElementById("btnCRT");
const elInv        = document.getElementById("btnInv");
const elDpad       = document.getElementById("dpad");
const elStage      = document.getElementById("stage");

// ---- audio unlock on first gesture ----
let _titlePlayed=false;
function ensureAudioOnGesture(){
  if(game.scene==="title" && !_titlePlayed){ _titlePlayed=true; Sound.title(); }
}

// ---- shared actions (used by both keyboard and touch) ----
function pressEnter(){
  if(game.scene==="title") startNew();
  else if(game.scene==="dead") respawn();
  else if(game.scene==="win") resetGame();
}
function pressContinue(){
  if(game.scene==="title" && hasSave()){
    if(loadGame()){ Sound.beep(); say("Welcome back. You are in: "+rooms[game.room].name+".",11); }
  }
}
function submitCommand(){
  const v = parserInput.value; parserInput.value="";
  if(game.scene==="play" && v.trim()) handleCommand(v);
}

// ---- contextual control UI (title/death/win buttons vs. play controls) ----
function updateToggleLabels(){
  if(elSound) elSound.textContent = Sound.isMuted() ? "SOUND OFF" : "SOUND ON";
  if(elCRT)   elCRT.textContent   = crtOn ? "CRT ON" : "CRT OFF";
}
function updateControlsUI(){
  const playing = (game.scene==="play");
  elScreenBtns.classList.toggle("hidden", playing);
  elPlayCtrls.classList.toggle("hidden", !playing);
  if(!playing){
    if(game.scene==="title"){
      elPrimary.textContent  = hasSave() ? "NEW GAME" : "START";
      elContinue.style.display = hasSave() ? "" : "none";
      elContinue.textContent = "CONTINUE";
    } else if(game.scene==="dead"){
      elPrimary.textContent  = "CONTINUE";
      elContinue.style.display = "none";
    } else if(game.scene==="win"){
      elPrimary.textContent  = "PLAY AGAIN";
      elContinue.style.display = "none";
    }
  }
}

// ====================== KEYBOARD ======================
// Capture phase: arrows always drive movement (never the text cursor).
window.addEventListener("keydown", (e)=>{
  const typing = (document.activeElement===parserInput);
  if((e.key==="t"||e.key==="T") && !typing){ setCRT(!crtOn); return; }
  if((e.key==="m"||e.key==="M") && !typing){ Sound.toggleMute(); updateToggleLabels(); return; }
  if((e.key==="i"||e.key==="I") && !typing && game.scene==="play"){ toggleInv(); return; }

  if(e.key==="ArrowLeft"||e.key==="ArrowRight"||e.key==="ArrowUp"||e.key==="ArrowDown"){
    if(game.scene==="play") keys[e.key]=true;
    e.preventDefault();
    return;
  }
  if(game.scene!=="play"){
    if(e.key==="Enter"){ e.preventDefault(); pressEnter(); return; }
    if(e.key==="c"||e.key==="C"){ pressContinue(); return; }
  }
}, true);
window.addEventListener("keyup",(e)=>{ keys[e.key]=false; });
window.addEventListener("keydown", ensureAudioOnGesture);

// Submit a typed command on Enter while playing.
parserInput.addEventListener("keydown",(e)=>{
  if(e.key==="Enter"){ e.preventDefault(); submitCommand(); }
});
// Desktop convenience: start typing to focus the command field.
window.addEventListener("keydown",(e)=>{
  if(game.scene!=="play" || TOUCH) return;
  if(e.key.length===1 && /[a-z0-9 '?]/i.test(e.key) && document.activeElement!==parserInput){
    if(/[mti]/i.test(e.key)) return; // reserved toggles (mute / crt / inventory)
    parserInput.focus();
  }
});

// ====================== TOUCH / POINTER ======================
// On-screen D-pad.
function clearDirs(){
  keys.ArrowUp=keys.ArrowDown=keys.ArrowLeft=keys.ArrowRight=false;
}
elDpad.querySelectorAll(".dbtn").forEach(btn=>{
  const dir = btn.getAttribute("data-dir");
  btn.addEventListener("pointerdown",(e)=>{ e.preventDefault(); ensureAudioOnGesture(); keys[dir]=true; }, {passive:false});
  btn.addEventListener("pointerup",  (e)=>{ e.preventDefault(); keys[dir]=false; }, {passive:false});
  btn.addEventListener("pointercancel",(e)=>{ keys[dir]=false; });
  // block context menu / text-select on long press
  btn.addEventListener("contextmenu",(e)=>e.preventDefault());
});
window.addEventListener("pointerup", clearDirs);
window.addEventListener("pointercancel", clearDirs);
window.addEventListener("blur", clearDirs);

// Buttons.
elSend.addEventListener("click",(e)=>{ e.preventDefault(); ensureAudioOnGesture(); submitCommand(); parserInput.focus(); });
elPrimary.addEventListener("click",()=>{ ensureAudioOnGesture(); pressEnter(); });
elContinue.addEventListener("click",()=>{ ensureAudioOnGesture(); pressContinue(); });
elSound.addEventListener("click",()=>{ ensureAudioOnGesture(); Sound.toggleMute(); updateToggleLabels(); });
elCRT.addEventListener("click",()=>{ setCRT(!crtOn); });
elInv.addEventListener("click",()=>{ ensureAudioOnGesture(); toggleInv(); });

// Convert a pointer event to internal 320x200 game coordinates.
function eventToGame(e){
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (W / r.width),
    y: (e.clientY - r.top)  * (H / r.height)
  };
}
function runHotspot(cmd){
  const c = (typeof cmd === "function") ? cmd() : cmd;
  if(c) handleCommand(c);
}
function setWalkTarget(gx,gy){
  const wb = rooms[game.room].walk;
  let tx = gx-5, ty = gy-19;
  tx = Math.max(wb.x, Math.min(wb.x+wb.w-11, tx));
  ty = Math.max(wb.y-19, Math.min(wb.y+wb.h-19, ty));
  game.target = {x:tx, y:ty};
}
function toggleInv(){ if(game.scene==="play"){ game.invOpen=!game.invOpen; Sound.blip(); } }

// Tap the stage: advance menus, work the inventory, hit objects, or walk.
elStage.addEventListener("pointerdown",(e)=>{
  ensureAudioOnGesture();
  if(game.scene!=="play"){
    e.preventDefault();
    if(game.scene==="title"){ if(!hasSave()) startNew(); }
    else if(game.scene==="dead") respawn();
    else if(game.scene==="win") resetGame();
    return;
  }
  e.preventDefault();
  const p = eventToGame(e);
  // Inventory open: tap an item to examine, tap anywhere else to close.
  if(game.invOpen){
    const hit = invRows().find(r=> p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y-2 && p.y<=r.y+r.h);
    if(hit) say(ITEM_DESC[hit.id] || ("It's "+ITEMS[hit.id].name+"."), 11);
    game.invOpen = false;
    return;
  }
  if(p.y >= 160) return; // taps on the text/HUD strip do nothing
  const room = rooms[game.room];
  const hs = (room.hotspots||[]).find(h=> p.x>=h.x && p.x<=h.x+h.w && p.y>=h.y && p.y<=h.y+h.h);
  if(hs){ game.tapFx={x:hs.x,y:hs.y,w:hs.w,h:hs.h,life:16}; runHotspot(hs.cmd); return; }
  setWalkTarget(p.x, p.y);   // otherwise walk there
});

function startNew(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  game.inv=[]; game.flags={};
  game.score=0; game.deaths=0; game.awarded={};
  game.follow=null;
  game.scene="play"; travel("street");
  say("Welcome to YE OLDE ANTIQUES. Your beloved Penelope is somewhere inside...",14);
  Sound.beep();
}

/* =========================================================
   UPDATE & RENDER
   ========================================================= */
const SPEED = 1.4;
let stepTimer = 0;
function update(){
  if(game.scene!=="play") return;
  if(game.invOpen){ game.walking=false; return; }   // paused while inventory is open
  const room = rooms[game.room];
  const wb = room.walk;
  // Manual controls override any point-and-click target.
  if(keys.ArrowLeft||keys.ArrowRight||keys.ArrowUp||keys.ArrowDown) game.target=null;
  let dx=0, dy=0, moving=false;
  if(keys.ArrowLeft){ dx-=SPEED; game.facing=-1; }
  if(keys.ArrowRight){ dx+=SPEED; game.facing=1; }
  if(keys.ArrowUp){ dy-=SPEED; }
  if(keys.ArrowDown){ dy+=SPEED; }
  // Point-and-click: walk toward the tapped target.
  if(game.target){
    const ddx=game.target.x-game.px, ddy=game.target.y-game.py;
    const dist=Math.hypot(ddx,ddy);
    if(dist<=SPEED){ game.px=game.target.x; game.py=game.target.y; game.target=null; }
    else { dx+=SPEED*ddx/dist; dy+=SPEED*ddy/dist; game.facing = ddx<0?-1:1; }
  }
  if(dx||dy){
    moving=true;
    game.px += dx; game.py += dy;
    const footY = game.py + 19;
    if(game.px < wb.x) game.px = wb.x;
    if(game.px > wb.x+wb.w-11) game.px = wb.x+wb.w-11;
    if(footY < wb.y) game.py = wb.y-19;
    if(footY > wb.y+wb.h) game.py = wb.y+wb.h-19;
  }
  // EDGE-TRIGGERED TRAVEL — left/right edges trigger every frame (works for
  // both walking and point-and-click); vertical transitions need walk intent.
  if(game.room==="shop"){
    if(game.px <= wb.x+1){ travel("street"); }
    else if(game.px >= wb.x+wb.w-12){ travel("upstairs"); }
  } else if(game.room==="upstairs"){
    if(game.px >= wb.x+wb.w-12){ travel("shop"); }
  } else if(game.room==="catacombs"){
    if(game.px <= wb.x+1){ travel("shop"); }
    else if(flag("gate_open") && game.px >= wb.x+wb.w-12){ travel("crypt"); }
  } else if(game.room==="crypt"){
    if(game.px <= wb.x+1){ travel("catacombs"); }
    else if(flag("lab_open") && game.px >= wb.x+wb.w-12){ travel("lab"); }
  } else if(game.room==="lab"){
    if(game.px <= wb.x+1){ travel("crypt"); }
  }
  if(moving){
    if(game.room==="street" && flag("door_open") && game.px>146 && game.px<188 && keys.ArrowUp){ travel("shop"); }
    if(game.room==="shop" && flag("clock_open") && game.px>150 && game.px<196 && keys.ArrowUp){ travel("catacombs"); }
  }
  game.walking = moving;
  if(moving){
    stepTimer++;
    if(stepTimer%8===0){ game.walkPhase ^=1; Sound.footstep(); }
  } else game.walkPhase=0;
  // Penelope follows once freed (in the crypt and the lab).
  if(flag("freed") && (game.room==="crypt"||game.room==="lab")){
    if(!game.follow) game.follow = {x:game.px-game.facing*13, y:game.py};
    const dxp = (game.px - game.facing*13) - game.follow.x;
    const dyp = game.py - game.follow.y;
    game.follow.x += dxp*0.12; game.follow.y += dyp*0.12;
  }
  if(game.msgTimer>0) game.msgTimer--;
}

function drawHUD(){
  rect(0,160,W,40, 0);
  rect(0,160,W,1, 8);
  const lines = wrap(game.msg || "", 51).slice(0,3);
  let yy=164;
  for(const ln of lines){ text(ln, 6, yy, (game.msgTimer>0?game.textColor:7)); yy+=8; }
  text("> "+(parserInput.value.toUpperCase()), 6, 190, 10);
  if(((performance.now()/400)|0)%2===0)
    rect(6 + textWidth("> "+parserInput.value), 190, 5, 7, 10);
}

function pad3(n){ n=""+n; return "000".slice(n.length)+n; }
function drawTopBar(){
  rect(0,0,W,8,0);                 // Sierra-style menu/score bar
  text("SCORE "+pad3(game.score)+"/"+MAX_SCORE, 2, 1, 14);
  const dt = "DEATHS "+game.deaths;
  text(dt, W-2-textWidth(dt), 1, 12);
}

/* ---- inventory panel ---- */
function invRows(){
  return game.inv.map((id,i)=>({ id, x:50, y:48+i*16, w:220, h:14 }));
}
function drawInventory(){
  rect(36,20,248,134,0);
  rect(36,20,248,2,15); rect(36,152,248,2,15);
  rect(36,20,2,134,15); rect(282,20,2,134,15);
  textCentered("- INVENTORY -", 28, 14);
  if(game.inv.length===0){
    textCentered("YOU ARE EMPTY-HANDED", 72, 7);
  } else {
    for(const r of invRows()) text("* "+ITEMS[r.id].name, r.x+6, r.y, 11);
  }
  textCentered(TOUCH ? "TAP AN ITEM TO EXAMINE" : "PRESS I OR CLICK TO CLOSE", 134, 8);
  if(TOUCH) textCentered("TAP OUTSIDE TO CLOSE", 144, 8);
}
function outline(x,y,w,h,c){ rect(x,y,w,1,c); rect(x,y+h-1,w,1,c); rect(x,y,1,h,c); rect(x+w-1,y,1,h,c); }
function drawTapFx(){
  // walk-to marker at the target's feet
  if(game.target){
    const mx=(game.target.x+5)|0, my=(game.target.y+19)|0;
    const c = (((performance.now()/120)|0)%2) ? 14 : 15;
    line(mx-3,my-3,mx+3,my+3,c); line(mx-3,my+3,mx+3,my-3,c);
  }
  // brief highlight around a tapped hotspot
  if(game.tapFx && game.tapFx.life>0){
    const c = (game.tapFx.life%4<2) ? 15 : 14;
    outline(game.tapFx.x-1, game.tapFx.y-1, game.tapFx.w+2, game.tapFx.h+2, c);
    game.tapFx.life--;
  }
}
function renderPlay(){
  const room = rooms[game.room];
  room.draw();
  // Penelope follows once freed
  if(flag("freed") && game.follow && (game.room==="crypt"||game.room==="lab")){
    drawSprite(PEN, game.follow.x|0, game.follow.y|0, game.facing<0);
  }
  const frame = (game.walking && game.walkPhase) ? HUGO_B : HUGO_A;
  drawSprite(frame, game.px|0, game.py|0, game.facing<0);
  drawTapFx();
  drawTopBar();
  drawHUD();
  if(game.invOpen) drawInventory();
}

function renderTitle(){
  clear(0);
  rect(0,0,W,8,4); rect(0,H-8,W,8,4); rect(0,0,8,H,4); rect(W-8,0,8,H,4);
  dither(0,0,W,8,4,12); dither(0,H-8,W,8,12,4);
  rect(110,70,100,60,8); rect(120,50,80,24,8);
  for(let i=0;i<40;i++){ rect(130-i,72-i,2,2,0); rect(190+i,72-i,2,2,0); }
  rect(150,60,20,70,0);
  rect(124,80,12,12,14); rect(184,80,12,12,14);
  rect(150,100,20,30,6);
  rect(40,90,26,60,6); rect(43,93,20,20,15); rect(48,140,10,8,14);
  text("TICK", 36,76, 7);
  textCentered("HUGO IV", 24, 14);
  textCentered("THE ANTIQUE SHOP", 36, 12);
  textCentered("OF HORRORS", 46, 12);
  textCentered("AN UNOFFICIAL EGA ADVENTURE", 150, 7);
  if(((performance.now()/500)|0)%2===0)
    textCentered(TOUCH ? "TAP START BELOW" : "PRESS ENTER TO BEGIN", 168, 15);
  if(hasSave()) textCentered(TOUCH ? "OR TAP CONTINUE" : "C = CONTINUE SAVED GAME", 180, 11);
  if(!TOUCH) textCentered("M=SOUND   T=CRT", 190, 8);
}

function renderDead(){
  clear(0);
  // blood-drip border
  rect(0,0,W,6,4); for(let x=4;x<W;x+=16) rect(x,6,3,4+(x%5),4);
  textCentered("YOU HAVE DIED", 36, 12);
  const lines = wrap(game.deathCause||"Hugo has met an untimely end.", 44);
  let y=64; for(const ln of lines){ textCentered(ln,y,7); y+=10; }
  textCentered("- but death is rarely permanent here -", y+12, 8);
  if(((performance.now()/500)|0)%2===0)
    textCentered(TOUCH ? "TAP CONTINUE BELOW" : "PRESS ENTER TO CONTINUE", y+32, 15);
}

function renderWin(){
  clear(0);
  rect(0,0,W,8,2); rect(0,H-8,W,8,2);
  dither(0,0,W,8,2,10); dither(0,H-8,W,8,10,2);
  // Hugo + Penelope together
  drawSprite(HUGO_A, 130, 60, true);
  drawSprite(PEN, 160, 60, false);
  // little hearts
  for(const hx of [150,156]) { rect(hx,52,4,3,12); rect(hx+1,55,2,2,12); }
  textCentered("THE CURSE IS BROKEN", 30, 14);
  const body = "With Hammerstein's machine in ruins, Hugo and Penelope flee the laboratory and climb back into the moonlight. The antique shop can keep its dreadful secrets. Home, and tea, await.";
  const lines = wrap(body, 44); let y=86;
  for(const ln of lines){ textCentered(ln,y,11); y+=10; }
  const perfect = (game.score>=MAX_SCORE && game.deaths===0);
  textCentered("FINAL SCORE "+game.score+"/"+MAX_SCORE+"   DEATHS "+game.deaths, y+8, 14);
  textCentered(perfect ? "A FLAWLESS RESCUE!" : "THE END", y+20, perfect?10:14);
  if(((performance.now()/500)|0)%2===0)
    textCentered(TOUCH ? "TAP PLAY AGAIN BELOW" : "PRESS ENTER TO PLAY AGAIN", y+36, 15);
}

let _winPlayed=false;
function resetGame(){
  game.scene="title"; game.room="street";
  game.inv=[]; game.flags={};
  game.px=150; game.py=150; game.facing=1;
  game.msg=""; game.msgTimer=0;
  game.score=0; game.deaths=0; game.awarded={};
  game.target=null; game.invOpen=false; game.tapFx=null; game.follow=null;
  _titlePlayed=false; _winPlayed=false;
}

let _uiScene = null;
function frame(){
  if(game.scene !== _uiScene){ _uiScene = game.scene; updateControlsUI(); }
  update();
  if(game.scene==="title") renderTitle();
  else if(game.scene==="dead") renderDead();
  else if(game.scene==="win"){ if(!_winPlayed){ _winPlayed=true; Sound.fanfare(); } renderWin(); }
  else renderPlay();
  requestAnimationFrame(frame);
}

/* boot */
resetGame();
updateToggleLabels();
updateControlsUI();
say("Welcome to YE OLDE ANTIQUES.",14);
frame();
</script>
